name: Build CI Image

on:
  push:
    branches: [main]
    paths:
      - '.github/docker/Dockerfile.ci'
      - '.github/workflows/ci-image.yml'
  workflow_dispatch:

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CI image
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          file: .github/docker/Dockerfile.ci
          push: true
          tags: ghcr.io/sean-stapleton-doyle/maketex-ci:ubuntu-24.04
          labels: |
            org.opencontainers.image.source=https://github.com/sean-stapleton-doyle/maketex
            org.opencontainers.image.description=Prebuilt Ubuntu 24.04 + GCC 14 + TeX Live CI image for maketex
          cache-from: type=gha
          cache-to: type=gha,mode=max
