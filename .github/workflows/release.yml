name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches CMakeLists.txt version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cmake_version="$(sed -n 's/^project(maketex VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          echo "Tag version:   $tag_version"
          echo "CMake version: $cmake_version"
          if [ "$tag_version" != "$cmake_version" ]; then
            echo "::error::Tag v$tag_version does not match CMakeLists.txt VERSION $cmake_version"
            exit 1
          fi

  build:
    needs: verify-tag
    if: always() && (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            compiler: ""
          - target: macos-x86_64
            os: macos-15-intel
            compiler: ""
          - target: linux-x86_64
            os: ubuntu-24.04
            compiler: g++-14
          - target: linux-arm64
            os: ubuntu-24.04-arm
            compiler: g++-14

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache pipx tools (Linux cmake)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pipx
            ~/.local/bin
          key: pipx-cmake-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build ccache pipx
          if [ ! -x "$HOME/.local/bin/cmake" ]; then
            pipx install cmake
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ninja ccache

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cli/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-release-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ccache-release-${{ matrix.target }}-

      - name: Configure
        env:
          CPM_SOURCE_CACHE: ~/.cache/CPM
        run: |
          extra_flags=()
          if [ -n "${{ matrix.compiler }}" ]; then
            extra_flags+=("-DCMAKE_CXX_COMPILER=${{ matrix.compiler }}")
            extra_flags+=("-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc")
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMAKETEX_BUILD_CLI=ON \
            -DMAKETEX_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            "${extra_flags[@]}"

      - name: Build
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE=500M
          export CCACHE_COMPRESS=true
          ccache -z
          cmake --build build --parallel
          ccache -s

      - name: Run unit tests
        run: ctest --test-dir build --label-exclude "integration|e2e" --output-on-failure -j 4

      - name: Stage and package archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            version="$(sed -n 's/^project(maketex VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)-dev"
          fi
          pkg="maketex-${version}-${{ matrix.target }}"
          cmake --install build --component maketex --prefix "stage/${pkg}" --strip
          cp README.md "stage/${pkg}/"
          if [ -f LICENSE ]; then
            cp LICENSE "stage/${pkg}/"
          fi

          # Smoke-test the installed binary.
          "stage/${pkg}/bin/maketex" --version
          "stage/${pkg}/bin/maketex" --help >/dev/null

          mkdir -p dist
          tar -C stage -czf "dist/${pkg}.tar.gz" "${pkg}"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: maketex-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all release archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Install nFPM
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nfpm

      - name: Build .deb and .rpm packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p nfpm-stage
          for pair in x86_64:amd64 arm64:arm64; do
            linux_arch="${pair%%:*}"
            nfpm_arch="${pair##*:}"
            pkg="maketex-${version}-linux-${linux_arch}"
            tar -xzf "dist/${pkg}.tar.gz" -C nfpm-stage
            sed \
              -e "s|\${NFPM_VERSION}|${version}|g" \
              -e "s|\${NFPM_ARCH}|${nfpm_arch}|g" \
              -e "s|\${NFPM_STAGE}|${PWD}/nfpm-stage/${pkg}|g" \
              packaging/nfpm/nfpm.yaml > nfpm-stage/nfpm.yaml
            nfpm package --config nfpm-stage/nfpm.yaml --packager deb --target dist/
            nfpm package --config nfpm-stage/nfpm.yaml --packager rpm --target dist/
          done
          ls -lh dist/

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.deb *.rpm > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS.txt

  publish-homebrew:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download release checksums
        uses: actions/download-artifact@v8
        with:
          name: release-checksums
          path: dist

      - name: Render Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out/Formula
          sh packaging/homebrew/render-formula.sh "$version" dist/SHA256SUMS.txt > out/Formula/maketex.rb
          cat out/Formula/maketex.rb

      - name: Upload rendered formula artifact
        uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: out/Formula/maketex.rb

      - name: Push to homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN secret is not set; skipping push to sean-stapleton-doyle/homebrew-tap."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/sean-stapleton-doyle/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/Formula/maketex.rb tap/Formula/maketex.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/maketex.rb
          if git diff --cached --quiet; then
            echo "Formula/maketex.rb already up to date."
          else
            git commit -m "maketex ${version}"
            git push origin HEAD
          fi

  publish-aur:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download release checksums
        uses: actions/download-artifact@v8
        with:
          name: release-checksums
          path: dist

      - name: Render AUR PKGBUILD and .SRCINFO
        run: |
          version="${GITHUB_REF_NAME#v}"
          sh packaging/aur/render-aur.sh "$version" dist/SHA256SUMS.txt out/aur
          cat out/aur/PKGBUILD

      - name: Upload rendered AUR files artifact
        uses: actions/upload-artifact@v7
        with:
          name: aur-maketex-bin
          path: |
            out/aur/PKGBUILD
            out/aur/.SRCINFO

      - name: Push to AUR (maketex-bin)
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_GIT_NAME: ${{ secrets.AUR_GIT_NAME }}
          AUR_GIT_EMAIL: ${{ secrets.AUR_GIT_EMAIL }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY secret is not set; skipping push to AUR maketex-bin."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/maketex-bin.git aur-repo
          cp out/aur/PKGBUILD out/aur/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "${AUR_GIT_NAME:-Sean Stapleton Doyle}"
          git config user.email "${AUR_GIT_EMAIL:-seanstapletondoyle@gmail.com}"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "AUR maketex-bin already up to date."
          else
            git commit -m "Update maketex-bin to ${version}"
            git push origin master
          fi
