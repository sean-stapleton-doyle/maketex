name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - 'demo/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - 'demo/**'

jobs:
  # Unit tests plus the integration suite against a full TeX Live, so every
  # testdata/ fixture runs (a local BasicTeX skips several of them).
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 ninja-build pipx \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-bibtex-extra biber texlive-xetex texlive-luatex \
            texlive-pictures texlive-science texlive-extra-utils \
            texlive-fonts-recommended lmodern fonts-lmodern \
            python3-pygments python-is-python3 ghostscript texlive-font-utils

      # Ubuntu 24.04's CMake (3.28) can't request C++26 from GCC 14 and
      # would silently build as C++17; CMakeLists.txt refuses it.
      - name: Install CMake
        run: |
          pipx install cmake
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache CPM sources
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: cpm-${{ hashFiles('CMakeLists.txt', 'cli/CMakeLists.txt') }}

      - name: Configure
        env:
          CPM_SOURCE_CACHE: ~/.cache/CPM
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --label-exclude "integration|e2e" --output-on-failure -j 4

      - name: Integration tests
        run: ctest --test-dir build --label-regex integration --output-on-failure -j 4

      - name: End-to-end tests (the maketex binary)
        run: ctest --test-dir build --label-regex e2e --output-on-failure -j 4

  # Unit tests on the primary development platform.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --label-exclude "integration|e2e" --output-on-failure -j 4

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned to the major used locally; formatting differs across majors.
      - name: Install clang-format
        run: pipx install 'clang-format>=22,<23'
      - name: Check formatting
        run: |
          find src include cli test \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
