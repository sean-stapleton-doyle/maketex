name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - 'demo/**'
      - 'examples/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - 'demo/**'
      - 'examples/**'

jobs:
  # Unit tests plus the integration suite against a full TeX Live, so every
  # testdata/ fixture runs (a local BasicTeX skips several of them).
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 ninja-build ccache pipx \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-bibtex-extra biber texlive-xetex texlive-luatex \
            texlive-pictures texlive-science texlive-extra-utils \
            texlive-fonts-recommended lmodern fonts-lmodern \
            python3-pygments python-is-python3 ghostscript texlive-font-utils

      - name: Cache pipx tools (cmake)
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pipx
            ~/.local/bin
          key: pipx-cmake-${{ runner.os }}-${{ runner.arch }}-v1

      # Ubuntu 24.04's CMake (3.28) can't request C++26 from GCC 14 and
      # would silently build as C++17; CMakeLists.txt refuses it.
      - name: Install CMake
        run: |
          if [ ! -x "$HOME/.local/bin/cmake" ]; then
            pipx install cmake
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cli/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-ci-${{ runner.os }}-${{ runner.arch }}-debug-${{ github.sha }}
          restore-keys: |
            ccache-ci-${{ runner.os }}-${{ runner.arch }}-debug-

      - name: Configure
        env:
          CPM_SOURCE_CACHE: ~/.cache/CPM
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE=500M
          export CCACHE_COMPRESS=true
          ccache -z
          cmake --build build
          ccache -s

      - name: Unit tests
        run: ctest --test-dir build --label-exclude "integration|e2e" --output-on-failure -j 4

      - name: Integration tests
        run: ctest --test-dir build --label-regex integration --output-on-failure -j 4

      - name: End-to-end tests (the maketex binary)
        run: ctest --test-dir build --label-regex e2e --output-on-failure -j 4

  # Unit tests on the primary development platform.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ninja ccache

      - name: Cache CPM sources
        uses: actions/cache@v6
        with:
          path: ~/.cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'cli/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-ci-${{ runner.os }}-${{ runner.arch }}-debug-${{ github.sha }}
          restore-keys: |
            ccache-ci-${{ runner.os }}-${{ runner.arch }}-debug-

      - name: Configure
        env:
          CPM_SOURCE_CACHE: ~/.cache/CPM
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE=500M
          export CCACHE_COMPRESS=true
          ccache -z
          cmake --build build
          ccache -s

      - name: Unit tests
        run: ctest --test-dir build --label-exclude "integration|e2e" --output-on-failure -j 4

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Cache pipx tools (clang-format)
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/pipx
            ~/.local/bin
          key: pipx-clang-format-22-${{ runner.os }}-${{ runner.arch }}-v1

      # Pinned to the major used locally; formatting differs across majors.
      - name: Install clang-format
        run: |
          if [ ! -x "$HOME/.local/bin/clang-format" ]; then
            pipx install 'clang-format>=22,<23'
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          find src include cli test \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
